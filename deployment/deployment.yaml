apiVersion: apps/v1
kind: Deployment
metadata:
  name: shgardi_app-deployment
  labels:
    app: shgardi_app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shgardi_app
  template:
    metadata:
      labels:
        app: shgardi_app
    spec:
      containers:
        - name: shgardi_app
          image: aaqibmd123/assignment:${COMMIT_HASH}
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: shgardi_app-service
spec:
  selector:
    app: shgardi_app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
